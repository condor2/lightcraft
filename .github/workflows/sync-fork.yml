name: Sync fork

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with upstream
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync fork
        run: |
          git remote add upstream https://github.com/storytold/lightcraft.git
          git fetch upstream
          git merge upstream/main
          git push origin main
